<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Don't Give Up - Login</title>
  <link rel="stylesheet" href="estilo1.css">
</head>
<body>

  <div class="tela-login">
    <div class="container">
      <h1>Don't Give Up</h1>
      <p class="subtitulo">Controle sua vida financeira</p>
      
      <div class="formulario">
        <input type="text" id="nome-usuario" placeholder="Digite seu nome" required>
        <button onclick="entrar()" class="btn-primario">Entrar</button>
      </div>
    </div>
  </div>

  <script>
    function entrar() {
      const nome = document.getElementById('nome-usuario').value.trim();
      
      if (nome === "") {
        alert("Por favor, digite seu nome.");
        return;
      }

      // Salva o nome para usar na próxima tela
      localStorage.setItem('nomeUsuario', nome);
      
      // Redireciona para a tela principal
      window.location.href = "tabela_financa.html";
    }
  </script>
</body>
</html>
